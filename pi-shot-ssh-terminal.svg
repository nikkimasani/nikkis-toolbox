<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760"><rect width="1200" height="760" fill="#dfe4ea"/><rect x="120" y="90" width="960" height="580" rx="22" fill="#0b1220" stroke="#475569" stroke-width="3"/><rect x="120" y="90" width="960" height="54" rx="22" fill="#1e293b"/><circle cx="154" cy="117" r="8" fill="#ff5f57"/><circle cx="180" cy="117" r="8" fill="#febc2e"/><circle cx="206" cy="117" r="8" fill="#28c840"/><text x="600" y="125" text-anchor="middle" font-family="system-ui" font-size="20" font-weight="700" fill="#cbd5e1">Terminal / PowerShell / Command Prompt</text><g font-family="ui-monospace,Menlo,Consolas,monospace" font-size="20"><text x="170" y="205" fill="#93c5fd">PS C:\Users\You&gt;</text><text x="390" y="205" fill="#f8fafc">ssh YOUR_USERNAME@nikkipi.local</text><text x="170" y="260" fill="#94a3b8">The authenticity of host 'nikkipi.local' can't be established.</text><text x="170" y="298" fill="#94a3b8">Are you sure you want to continue connecting (yes/no/[fingerprint])?</text><text x="910" y="298" fill="#f8fafc">yes</text><text x="170" y="353" fill="#94a3b8">YOUR_USERNAME@nikkipi.local's password:</text><text x="170" y="420" fill="#86efac">YOUR_USERNAME@nikkipi:~ $</text><text x="475" y="420" fill="#f8fafc">hostname</text><text x="170" y="458" fill="#c4b5fd">nikkipi</text><text x="170" y="515" fill="#86efac">YOUR_USERNAME@nikkipi:~ $</text><text x="475" y="515" fill="#f8fafc">hostname -I</text><text x="170" y="553" fill="#c4b5fd">192.168.1.42</text></g><rect x="165" y="592" width="870" height="46" rx="9" fill="#172033"/><text x="600" y="622" text-anchor="middle" font-family="system-ui" font-size="16" fill="#cbd5e1">Success looks like: YOUR_USERNAME@nikkipi:~ $</text></svg>