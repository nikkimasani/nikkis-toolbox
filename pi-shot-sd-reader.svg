<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#d6d2cc"/><stop offset="1" stop-color="#aaa59e"/></linearGradient><filter id="s"><feDropShadow dx="0" dy="12" stdDeviation="15" flood-opacity=".3"/></filter></defs><rect width="1200" height="700" fill="url(#bg)"/><text x="70" y="75" font-family="Arial" font-size="34" font-weight="700" fill="#252525">Step 3 · Insert the 128 GB microSD into the reader</text><g filter="url(#s)"><rect x="170" y="210" width="290" height="310" rx="35" fill="#efefec"/><rect x="225" y="260" width="180" height="118" rx="16" fill="#24282e"/><rect x="278" y="175" width="78" height="135" rx="9" fill="#25292e"/><path d="M278 175h78v34h-78z" fill="#c20d2e"/><text x="317" y="236" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#fff">128 GB</text><text x="317" y="410" text-anchor="middle" font-family="Arial" font-size="24" font-weight="700" fill="#333">Card reader</text></g><path d="M317 160v-80" stroke="#8257ff" stroke-width="7"/><path d="M299 104l18-26 18 26" fill="none" stroke="#8257ff" stroke-width="7"/><rect x="545" y="185" width="500" height="350" rx="26" fill="#fff" stroke="#d3d3d3" stroke-width="2" filter="url(#s)"/><text x="595" y="240" font-family="Arial" font-size="28" font-weight="700" fill="#222">Before you click Write</text><g font-family="Arial" font-size="22" fill="#3f4851"><circle cx="605" cy="300" r="13" fill="#57c68a"/><text x="635" y="308">Confirm the card shows about 128 GB</text><circle cx="605" cy="355" r="13" fill="#57c68a"/><text x="635" y="363">Do not select your computer’s internal drive</text><circle cx="605" cy="410" r="13" fill="#57c68a"/><text x="635" y="418">Keep the reader plugged in until verification finishes</text></g><rect x="590" y="465" width="400" height="48" rx="12" fill="#fff3db" stroke="#edc56c"/><text x="790" y="496" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#7b5b