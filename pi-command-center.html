<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Pi Command">
<title>Pi Command Center</title>
<link rel="manifest" href="/pi-command-center.webmanifest">
<link rel="icon" href="/pi-pwa-icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/pi-pwa-icon.svg">
<link rel="stylesheet" href="/pi-command-center.css">
<link rel="stylesheet" href="/pi-command-center-enhancements.css">
<link rel="stylesheet" href="/pi-responsive-pwa.css">
<link rel="stylesheet" href="/pi-native-setup.css">
<link rel="stylesheet" href="/pi-project-visual-pass.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="logo"><span>🍓</span><div><strong>Pi Command Center</strong><small>Build. Connect. Create.</small></div></div>
    <nav>
      <button class="side-link active" data-view="home">⌂ <span>Overview</span></button>
      <button class="side-link" data-view="projects">◉ <span>Projects</span></button>
      <button class="side-link" data-view="inventory">▣ <span>My Inventory</span></button>
      <a class="setup-nav-link" href="#setup">◇ <span>Setup Guide</span></a>
      <button class="side-link" data-view="dashboard">⌘ <span>Pi Dashboard</span></button>
      <button class="side-link" data-view="resources">⚑ <span>Resources</span></button>
    </nav>
    <div class="side-card progress-card"><small>YOUR PROGRESS</small><div class="ring" id="overallRing"><span id="overallPct">0%</span></div><div id="overallText">0 steps completed</div></div>
    <div class="side-card recent-card"><small>RECENT PROJECT</small><div id="recentProject">Nothing started yet.</div></div>
    <div class="side-card help-card"><strong>▣ Need Help?</strong><span>Every step includes detailed actions, visual comparisons, troubleshooting, copy-ready commands, and saved progress.</span></div>
  </aside>
  <main class="main">
    <header class="mobile-header"><div><span>🍓</span><strong>Pi Command Center</strong></div><a class="outline-btn" href="/" target="_top">Nikki's Toolbox</a></header>
    <section id="homeView" class="view active"></section>
    <section id="projectView" class="view"></section>
    <section id="simpleView" class="view"></section>
  </main>
</div>
<div class="toast" id="toast">Copied</div>
<script src="/pi-command-center-data.js"></script>
<script src="/pi-project-deep-dive.js"></script>
<script src="/pi-command-center-app.js"></script>
<script src="/pi-project-deep-commands.js"></script>
<script src="/pi-native-setup.js"></script>
<script src="/pi-project-visual-pass.js"></script>
<script>
if(location.hash==='#setup'){setTimeout(()=>window.PI_NATIVE_SETUP?.open(),50)}
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('/pi-sw.js').catch(()=>{}));}
</script>
</body>
</html>
