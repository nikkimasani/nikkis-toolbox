<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07101a">
<title>Pi Command Center</title>
<link rel="stylesheet" href="/pi-command-center.css">
</head>
<body>
<div class="app-shell">
  <aside class="sidebar">
    <div class="logo"><span>🍓</span><div><strong>Pi Command Center</strong><small>Build. Connect. Create.</small></div></div>
    <nav>
      <button class="side-link active" data-view="home">⌂ <span>Overview</span></button>
      <button class="side-link" data-view="projects">◉ <span>Projects</span></button>
      <button class="side-link" data-view="inventory">▣ <span>My Inventory</span></button>
      <button class="side-link" data-view="setup">◇ <span>Setup Guide</span></button>
      <button class="side-link" data-view="dashboard">⌘ <span>Pi Dashboard</span></button>
      <button class="side-link" data-view="resources">⚑ <span>Resources</span></button>
    </nav>
    <div class="side-card progress-card"><small>YOUR PROGRESS</small><div class="ring" id="overallRing"><span id="overallPct">0%</span></div><div id="overallText">0 steps completed</div></div>
    <div class="side-card recent-card"><small>RECENT PROJECT</small><div id="recentProject">Nothing started yet.</div></div>
    <div class="side-card help-card"><strong>▣ Need Help?</strong><span>Every step includes a finish check, warning, and troubleshooting notes.</span></div>
  </aside>

  <main class="main">
    <header class="mobile-header"><div><span>🍓</span><strong>Pi Command Center</strong></div><a class="outline-btn" href="/" target="_top">Nikki's Toolbox</a></header>
    <section id="homeView" class="view active"></section>
    <section id="projectView" class="view"></section>
    <section id="simpleView" class="view"></section>
  </main>
</div>
<div class="toast" id="toast">Copied</div>
<script src="/pi-command-center-data.js"></script>
<script>
(function(){
'use strict';
const projects=Array.isArray(window.PI_PROJECTS)?window.PI_PROJECTS:[];
const foundation=Array.isArray(window.PI_FOUNDATION)?window.PI_FOUNDATION:[];
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const homeView=$('#homeView'),projectView=$('#projectView'),simpleView=$('#simpleView');
const progress=read('pi-build-progress-v5',{}), inventory=read('pi-inventory-v5',{}), notes=read('pi-notes-v5',{});
let currentProject=null,currentStep=0,currentTab='guide',difficulty='all',search='';
function read(k,f){try{return JSON.parse(localStorage.getItem(k)||JSON.stringify(f))}catch{return f}}
function save(){localStorage.setItem('pi-build-progress-v5',JSON.stringify(progress))}
function saveInv(){localStorage.setItem('pi-inventory-v5',JSON.stringify(inventory))}
function saveNotes(){localStorage.setItem('pi-notes-v5',JSON.stringify(notes))}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function show(v){[homeView,projectView,simpleView].forEach(x=>x.classList.remove('active'));v.classList.add('active');window.scrollTo({top:0,behavior:'smooth'})}
function done(p,i){return !!progress[p.id+'-'+i]}
function count(p){return p.steps.reduce((n,_,i)=>n+(done(p,i)?1:0),0)}
function total(){return projects.reduce((n,p)=>n+p.steps.length,0)}
function totalDone(){return projects.reduce((n,p)=>n+count(p),0)}
function updateOverall(){const t=total()||1,d=totalDone(),pct=Math.round(d/t*100);$('#overallPct').textContent=pct+'%';$('#overallText').textContent=d+' / '+total()+' steps completed';$('#overallRing').style.background=`conic-gradient(#8257ff ${pct}%,#202b3a ${pct}% 100%)`;const last=read('pi-last-v5',null);if(last){const p=projects.find(x=>x.id===last.id);if(p)$('#recentProject').innerHTML=`<strong>${esc(p.icon)} ${esc(p.title)}</strong><span>Step ${last.step+1}: ${esc(p.steps[last.step]?.title||'')}</span>`}}
function iconForMaterial(m){const x=m.toLowerCase();if(x.includes('display')||x.includes('screen'))return'▣';if(x.includes('cable')||x.includes('usb'))return'⌁';if(x.includes('screw')||x.includes('standoff'))return'⌘';if(x.includes('mirror'))return'◫';if(x.includes('pi 5')||x.includes('raspberry'))return'◉';if(x.includes('led'))return'💡';if(x.includes('button'))return'●';if(x.includes('keyboard'))return'⌨';return'◆'}
function projectArt(p){const type=p.id;let body='';if(type==='smart-mirror'){body=`<rect x="52" y="22" width="176" height="176" rx="9" fill="#241e1c" stroke="#5b4c46"/><rect x="66" y="34" width="148" height="150" rx="4" fill="url(#mirror)"/><circle cx="112" cy="92" r="28" fill="none" stroke="#f4f7fb" stroke-width="2"/><path d="M112 92l0-20M112 92l15 10" stroke="#fff" stroke-width="2"/><text x="161" y="78" fill="#f9d66b" font-size="12">87°</text><text x="161" y="99" fill="#d6e7ff" font-size="9">MON 17</text><circle cx="184" cy="126" r="8" fill="#5dde9d"/><circle cx="161" cy="144" r="6" fill="#6aa4ff"/>`}
else if(type==='electronics-lab'){body=`<rect x="58" y="56" width="166" height="104" rx="8" fill="#e7edf3"/><g fill="#718096">${Array.from({length:12},(_,i)=>`<circle cx="${74+i*12}" cy="76" r="2"/><circle cx="${74+i*12}" cy="140" r="2"/>`).join('')}</g><path d="M88 92v30M88 92h40v30" stroke="#ff6b6b" stroke-width="3"/><circle cx="128" cy="122" r="9" fill="#ffd84d"/><path d="M128 131v18" stroke="#777" stroke-width="2"/>`}
else if(type==='cyberdeck'){body=`<rect x="42" y="42" width="196" height="120" rx="12" fill="#181d28" stroke="#526078"/><rect x="58" y="55" width="164" height="62" rx="6" fill="#14283c"/><rect x="58" y="126" width="164" height="25" rx="5" fill="#0d121a"/>${Array.from({length:8},(_,i)=>`<rect x="${66+i*18}" y="132" width="11" height="6" rx="2" fill="#637084"/>`).join('')}`}
else if(type==='ai-terminal'){body=`<circle cx="140" cy="86" r="46" fill="#86baff"/><path d="M108 117l-10 24 29-11" fill="#86baff"/><circle cx="124" cy="86" r="5" fill="#142034"/><circle cx="140" cy="86" r="5" fill="#142034"/><circle cx="156" cy="86" r="5" fill="#142034"/>`}
else if(type==='pomodoro'){body=`<circle cx="140" cy="96" r="46" fill="#e94245"/><path d="M118 50c14-18 35-11 42 0" fill="#4da44d"/><text x="140" y="104" fill="#fff" font-size="22" font-weight="800" text-anchor="middle">25:00</text>`}
else if(type==='home-panel'){body=`<path d="M74 100l66-54 66 54v62h-48v-42h-36v42H74z" fill="#e8ebf0"/><path d="M117 65h46" stroke="#8257ff" stroke-width="8"/>`}
else if(type==='photo-frame'){body=`<rect x="48" y="42" width="184" height="124" rx="12" fill="#dee7f2"/><rect x="62" y="56" width="156" height="96" rx="5" fill="url(#photo)"/><circle cx="184" cy="79" r="10" fill="#ffe071"/><path d="M70 142l40-42 25 25 28-30 47 47" fill="#7399e8"/>`}
else if(type==='magic-frame'){body=`<rect x="70" y="35" width="140" height="140" rx="8" fill="#d9e2ea"/><path d="M76 169L202 43" stroke="#fff" stroke-width="13" opacity=".65"/><path d="M162 94l8 18 18 8-18 8-8 18-8-18-18-8 18-8z" fill="#fff"/>`}
else {body=`<circle cx="140" cy="104" r="58" fill="#27466f"/><circle cx="140" cy="104" r="36" fill="#85aaff"/><text x="140" y="115" text-anchor="middle" font-size="38" fill="#fff">${esc(p.icon)}</text>`}
return `<svg viewBox="0 0 280 210" aria-label="${esc(p.title)} generated illustration"><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#111c2a"/><stop offset="1" stop-color="#07101a"/></linearGradient><linearGradient id="mirror" x2="1" y2="1"><stop stop-color="#293746"/><stop offset=".5" stop-color="#101820"/><stop offset="1" stop-color="#213342"/></linearGradient><linearGradient id="photo" x2="1" y2="1"><stop stop-color="#5fc3ff"/><stop offset="1" stop-color="#7357d9"/></linearGradient></defs><rect width="280" height="210" rx="16" fill="url(#bg)"/><circle cx="235" cy="35" r="70" fill="#8257ff" opacity=".12"/>${body}</svg>`}
function stepArt(p,s,idx){if(p.id==='smart-mirror'){const mount=/mount/i.test(s.title);if(mount)return `<svg viewBox="0 0 760 430"><defs><linearGradient id="g" x2="1" y2="1"><stop stop-color="#151d28"/><stop offset="1" stop-color="#090e16"/></linearGradient></defs><rect width="760" height="430" rx="18" fill="url(#g)"/><rect x="105" y="58" width="550" height="310" rx="18" fill="#2a211c" stroke="#5c4a40" stroke-width="8"/><rect x="190" y="105" width="380" height="220" rx="6" fill="#171c24" stroke="#8b93a0" stroke-width="8"/><rect x="225" y="132" width="310" height="160" fill="#080b0f"/><path d="M350 325v42" stroke="#e5c6a4" stroke-width="25"/><g fill="#20252d" stroke="#ff5d55" stroke-width="4"><circle cx="190" cy="105" r="11"/><circle cx="570" cy="105" r="11"/><circle cx="190" cy="325" r="11"/><circle cx="570" cy="325" r="11"/></g><g font-family="system-ui" font-size="18" fill="#fff"><rect x="66" y="80" width="105" height="36" rx="9" fill="#36265f"/><text x="118" y="104" text-anchor="middle">M2.5 screw</text><line x1="171" y1="100" x2="190" y2="105" stroke="#9f7aea" stroke-width="3"/><rect x="588" y="192" width="120" height="36" rx="9" fill="#36265f"/><text x="648" y="216" text-anchor="middle">7” display</text><line x1="588" y1="210" x2="535" y2="210" stroke="#9f7aea" stroke-width="3"/><rect x="290" y="377" width="150" height="36" rx="9" fill="#36265f"/><text x="365" y="401" text-anchor="middle">DSI ribbon</text></g></svg>`;
const layers=['Mirror acrylic','7-inch display','Black mask','Pi 5'];return genericDiagram(layers,'🪞')}
if(p.id==='electronics-lab'){return `<svg viewBox="0 0 760 430"><rect width="760" height="430" rx="18" fill="#080d15"/><rect x="135" y="100" width="490" height="220" rx="18" fill="#e9eef4"/><g fill="#8995a5">${Array.from({length:22},(_,i)=>`<circle cx="${160+i*20}" cy="135" r="3"/><circle cx="${160+i*20}" cy="285" r="3"/>`).join('')}</g><rect x="268" y="170" width="70" height="20" rx="5" fill="#d7ad54"/><circle cx="420" cy="215" r="24" fill="#ffd94b" stroke="#f4a62a" stroke-width="4"/><path d="M420 240v42M401 242v40" stroke="#7c8794" stroke-width="4"/><path d="M174 170h94M338 180h58M444 220h92v65" fill="none" stroke="#f15b64" stroke-width="5"/><text x="174" y="155" fill="#222" font-size="18">GPIO17</text><text x="270" y="215" fill="#222" font-size="18">220–330Ω</text><text x="395" y="160" fill="#222" font-size="18">LED</text><text x="522" y="310" fill="#222" font-size="18">GND</text></svg>`}
return genericDiagram((s.visual||[s.title]).slice(0,5),p.icon)}
function genericDiagram(labels,icon){const safe=labels.map(esc).slice(0,5),xs=[85,225,365,505,645];let parts='';safe.forEach((l,i)=>{const x=xs[i],y=i%2?245:145;parts+=`<rect x="${x-62}" y="${y-36}" width="124" height="72" rx="13" fill="#111a29" stroke="${i===safe.length-1?'#8257ff':'#34445f'}" stroke-width="2"/><text x="${x}" y="${y-3}" text-anchor="middle" fill="#fff" font-size="13" font-weight="700">${l.slice(0,17)}</text><text x="${x}" y="${y+18}" text-anchor="middle" fill="#8fa0b5" font-size="10">${i===0?'START':i===safe.length-1?'CHECK':'NEXT'}</text>`;if(i<safe.length-1){const nx=xs[i+1],ny=(i+1)%2?245:145;parts+=`<path d="M${x+63} ${y} C ${x+95} ${y},${nx-95} ${ny},${nx-63} ${ny}" fill="none" stroke="#6677ff" stroke-width="3"/>`}});return `<svg viewBox="0 0 730 380"><rect width="730" height="380" rx="18" fill="#080d15"/><circle cx="365" cy="190" r="180" fill="#6956ff" opacity=".08"/><text x="28" y="43" font-size="30">${icon}</text><text x="72" y="39" fill="#8291a5" font-size="12" letter-spacing="2">VISUAL WALKTHROUGH</text>${parts}</svg>`}
function visualStrip(p,s){const actions=s.actions.slice(0,5);return `<div class="visual-strip">${actions.map((a,i)=>`<button class="visual-thumb" data-thumb="${i}"><div class="thumb-art">${genericDiagram([String(i+1),a.split(' ').slice(0,3).join(' ')],p.icon)}</div><span><b>${i+1}</b>${esc(a.split('. ')[0].slice(0,42))}</span></button>`).join('')}</div>`}
const COMMANDS={
  'smart-mirror::Configure mirror kiosk mode':[
    {label:'Test kiosk mode',lang:'bash',code:'chromium --kiosk --noerrdialogs --disable-infobars https://YOUR-APP.vercel.app/mirror'},
    {label:'Check Pi temperature',lang:'bash',code:'vcgencmd measure_temp'}],
  'smart-mirror::Run a thermal and stability test':[{label:'Check CPU temperature',lang:'bash',code:'vcgencmd measure_temp'}],
  'electronics-lab::Blink the LED from Python':[
    {label:'Install gpiozero',lang:'bash',code:'sudo apt update\nsudo apt install -y python3-gpiozero'},
    {label:'Create blink.py',lang:'python',code:"from gpiozero import LED\nfrom time import sleep\n\nled = LED(17)\n\nwhile True:\n    led.on()\n    sleep(1)\n    led.off()\n    sleep(1)"},
    {label:'Run the script',lang:'bash',code:'python3 blink.py'}],
  'electronics-lab::Add a push button input':[
    {label:'Button test',lang:'python',code:"from gpiozero import Button\n\nbutton = Button(2, pull_up=True)\nbutton.wait_for_press()\nprint('Button pressed')"}],
  'electronics-lab::Make the button control the LED':[
    {label:'Button controls LED',lang:'python',code:"from gpiozero import Button, LED\nfrom signal import pause\n\nbutton = Button(2, pull_up=True, bounce_time=0.05)\nled = LED(17)\n\nbutton.when_pressed = led.toggle\npause()"}],
  'dashboard::Test on the actual Pi':[{label:'Launch dashboard in kiosk mode',lang:'bash',code:'chromium --kiosk https://YOUR-APP.vercel.app'}]
};
function commandList(p,s){const list=COMMANDS[p.id+'::'+s.title]||[];if(!list.length)return'';return `<section class="command-section"><div class="section-mini"><span>Programming</span><h3>Copy-and-paste commands</h3><p>Use the copy button, paste into Terminal or your editor, then follow the note under each block.</p></div>${list.map((c,i)=>`<div class="code-card"><div class="code-head"><div><strong>${esc(c.label)}</strong><span>${esc(c.lang)}</span></div><button class="copy-btn" data-copy="cmd-${i}">⧉ Copy</button></div><pre id="cmd-${i}"><code>${esc(c.code)}</code></pre></div>`).join('')}</section>`}
function stepMaterials(p,s){const words=(s.title+' '+s.summary+' '+s.actions.join(' ')).toLowerCase();let list=p.materials.filter(m=>m.toLowerCase().split(/\s+/).some(w=>w.length>4&&words.includes(w)));if(list.length<3)list=[...new Set([...list,...p.materials.slice(0,4)])];return list.slice(0,7)}
function materialList(p,list=p.materials){return `<div class="material-list">${list.map(m=>{const k=p.id+'::'+m,have=!!inventory[k];return `<button class="material ${have?'have':''}" data-material="${encodeURIComponent(k)}"><span class="mat-icon">${iconForMaterial(m)}</span><span class="mat-name">${esc(m)}</span><span class="check">${have?'✓':'○'}</span></button>`}).join('')}</div>`}
function projectGrid(compact=false){return `<div class="${compact?'project-strip':'project-grid'}">${projects.map((p,i)=>{const d=count(p),pct=Math.round(d/p.steps.length*100);return `<button class="project-card ${currentProject&&p.id===currentProject.id?'selected':''}" data-project="${esc(p.id)}"><div class="project-image">${projectArt(p)}</div><div class="project-body"><h3>${i+1}. ${esc(p.title)}</h3><p>${esc(p.summary)}</p><div class="meta"><span class="difficulty ${esc(p.difficulty)}">${esc(p.difficulty)}</span><span>◷ ${esc(p.time)}</span><span>${d}/${p.steps.length}</span></div><div class="track"><i style="width:${pct}%"></i></div></div></button>`}).join('')}</div>`}
function renderHome(){show(homeView);const filtered=projects.filter(p=>(difficulty==='all'||p.difficulty===difficulty)&&(!search||(p.title+' '+p.summary+' '+p.materials.join(' ')).toLowerCase().includes(search.toLowerCase())));homeView.innerHTML=`<div class="breadcrumb">Home / Projects</div><section class="home-hero"><div><span class="eyebrow">Raspberry Pi Build Studio</span><h1>Build something amazing, one clear step at a time.</h1><p>Every project includes detailed actions, generated visuals, progress tracking, materials, warnings, and copy-ready programming commands where needed.</p></div><div class="home-art">${projectArt(projects[0])}</div></section><div class="home-actions"><button id="setupQuick"><strong>New to Raspberry Pi?</strong><span>Complete the shared setup first.</span><em>Start Setup Guide →</em></button><button id="inventoryQuick"><strong>Check your inventory</strong><span>Mark everything you already own.</span><em>View Inventory →</em></button><button id="resumeQuick"><strong>Resume your build</strong><span id="resumeHome">Your latest step will appear here.</span><em>Continue →</em></button></div><div class="section-head"><div><h2>All Projects</h2><p>Choose a project and start building.</p></div><div class="tools"><input id="search" placeholder="Search projects…" value="${esc(search)}"><select id="diff"><option value="all">All difficulties</option><option ${difficulty==='Easy'?'selected':''}>Easy</option><option ${difficulty==='Medium'?'selected':''}>Medium</option><option ${difficulty==='Advanced'?'selected':''}>Advanced</option></select></div></div><div class="project-grid">${filtered.map((p,i)=>projectCard(p,projects.indexOf(p))).join('')}</div>`;wireGlobal();const last=read('pi-last-v5',null);if(last){const p=projects.find(x=>x.id===last.id);if(p){$('#resumeHome').textContent=`${p.title}, step ${last.step+1}: ${p.steps[last.step]?.title||''}`;$('#resumeQuick').onclick=()=>openProject(p.id,last.step)}}updateOverall()}
function projectCard(p,i){const d=count(p),pct=Math.round(d/p.steps.length*100);return `<button class="project-card" data-project="${esc(p.id)}"><div class="project-image">${projectArt(p)}</div><div class="project-body"><h3>${i+1}. ${esc(p.title)}</h3><p>${esc(p.summary)}</p><div class="meta"><span class="difficulty ${esc(p.difficulty)}">${esc(p.difficulty)}</span><span>◷ ${esc(p.time)}</span><span>${d}/${p.steps.length}</span></div><div class="track"><i style="width:${pct}%"></i></div></div></button>`}
function wireGlobal(){$$('[data-project]').forEach(b=>b.onclick=()=>openProject(b.dataset.project,0));const sq=$('#setupQuick');if(sq)sq.onclick=renderSetup;const iq=$('#inventoryQuick');if(iq)iq.onclick=renderInventory;const si=$('#search');if(si)si.oninput=e=>{search=e.target.value;renderHome()};const df=$('#diff');if(df)df.onchange=e=>{difficulty=e.target.value;renderHome()}}
function openProject(id,step=0){currentProject=projects.find(p=>p.id===id);if(!currentProject)return;currentStep=Math.max(0,Math.min(Number(step)||0,currentProject.steps.length-1));currentTab='guide';localStorage.setItem('pi-last-v5',JSON.stringify({id,step:currentStep}));renderProject()}
function renderProject(){const p=currentProject,d=count(p),pct=Math.round(d/p.steps.length*100);show(projectView);projectView.innerHTML=`<div class="breadcrumb">⌂ › Projects › ${esc(p.title)} › Build Guide</div><section class="project-hero"><div class="hero-image">${projectArt(p)}</div><div class="hero-copy"><span class="featured">${p.id==='smart-mirror'?'Featured':esc(p.category)}</span><h1>${esc(p.title)}</h1><p>${esc(p.summary)}</p><div class="stats"><div><small>Difficulty</small><strong class="difficulty ${esc(p.difficulty)}">${esc(p.difficulty)}</strong></div><div><small>Time</small><strong>${esc(p.time)}</strong></div><div><small>Steps</small><strong>${p.steps.length}</strong></div><div><small>Category</small><strong class="purple">${esc(p.category)}</strong></div></div></div><button class="outline-btn" id="completeProject">${d===p.steps.length?'✓ Project Complete':'✓ Mark Project Complete'}</button></section><nav class="tabs"><button class="tab active" data-tab="guide">Guide</button><button class="tab" data-tab="steps">Steps (${p.steps.length})</button><button class="tab" data-tab="materials">Materials</button><button class="tab" data-tab="images">Images</button><button class="tab" data-tab="notes">Notes</button></nav><div id="tabBody"></div><section class="all-projects"><div class="section-head"><div><h2>All Projects</h2><p>Jump to another build anytime.</p></div></div>${projectGrid(true)}</section>`;$('#completeProject').onclick=()=>{p.steps.forEach((_,i)=>progress[p.id+'-'+i]=true);save();renderProject()};$$('[data-tab]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tab;$$('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));renderTab()});$$('[data-project]').forEach(b=>b.onclick=()=>openProject(b.dataset.project,0));renderTab();updateOverall()}
function renderTab(){const body=$('#tabBody');if(!body)return;if(currentTab==='guide')body.innerHTML=guideHTML();if(currentTab==='steps')body.innerHTML=stepsHTML();if(currentTab==='materials')body.innerHTML=materialsHTML();if(currentTab==='images')body.innerHTML=imagesHTML();if(currentTab==='notes')body.innerHTML=notesHTML();wireProject()}
function guideHTML(){const p=currentProject,s=p.steps[currentStep],d=count(p),pct=Math.round(d/p.steps.length*100),sm=stepMaterials(p,s);return `<div class="guide-layout"><section class="guide-card"><div class="step-heading"><span class="step-chip">Step ${currentStep+1} of ${p.steps.length}</span><div class="step-arrows"><button class="icon-btn" data-move="-1" ${currentStep===0?'disabled':''}>←</button><button class="icon-btn" data-move="1" ${currentStep===p.steps.length-1?'disabled':''}>→</button></div></div><h2>${esc(s.title)}</h2><p class="lead">${esc(s.summary)}</p><div class="what-card"><strong>What you'll do in this step</strong><span>${esc(s.summary)} Follow each numbered action in order. Do not move on until the finish check at the bottom matches what you see.</span></div><div class="build-section"><h3>Step-by-step instructions</h3><div class="instruction-visual-grid"><div class="actions">${s.actions.map((a,i)=>`<div class="action"><b>${i+1}</b><span>${esc(a)}</span></div>`).join('')}</div><div class="main-visual">${stepArt(p,s,currentStep)}</div></div>${visualStrip(p,s)}</div>${commandList(p,s)}<div class="callouts"><div class="callout success"><strong>✓ You're done when…</strong><span>${esc(s.success)}</span></div><div class="callout warning"><strong>⚠ Watch out for…</strong><span>${esc(s.warning)}</span></div></div><div class="guide-actions"><button class="outline-btn" data-move="-1" ${currentStep===0?'disabled':''}>← Previous Step</button><button class="primary-btn ${done(p,currentStep)?'done':''}" id="markStep">${done(p,currentStep)?'✓ Step Complete':'Mark Step Complete ✓'}</button><button class="outline-btn" data-move="1" ${currentStep===p.steps.length-1?'disabled':''}>Next Step →</button></div></section><aside class="rail"><div class="rail-card"><div class="rail-head"><h3>Materials for this step</h3><button data-tabjump="materials">View All</button></div>${materialList(p,sm)}</div><div class="rail-card"><h3>Project Progress</h3><small>${d} / ${p.steps.length} steps completed</small><div class="track big"><i style="width:${pct}%"></i></div><div class="step-list">${p.steps.map((st,i)=>`<button data-step="${i}" class="${i===currentStep?'active':''} ${done(p,i)?'complete':''}"><span>${done(p,i)?'✓':i+1}</span>${esc(st.title)}</button>`).join('')}</div></div><div class="rail-card tip"><h3>✿ Pro Tip</h3><p>${proTip(p,s)}</p></div></aside></div>`}
function proTip(p,s){if(p.id==='smart-mirror')return'Use removable mounting methods first. Once alignment, heat, cable routing, and mirror visibility are proven, then make the enclosure permanent.';if(p.id==='electronics-lab')return'Power the Pi off before changing your first circuits. Check the breadboard row twice before applying power.';return'Complete the finish check before tapping Next. If what you see does not match the guide, fix that step before continuing.'}
function stepsHTML(){const p=currentProject;return `<section class="panel"><h2>Complete build plan</h2><p>Tap any step to open it in the interactive guide.</p><div class="plan">${p.steps.map((s,i)=>`<button data-step="${i}" class="plan-step ${done(p,i)?'complete':''}"><span>${done(p,i)?'✓':i+1}</span><div><strong>${esc(s.title)}</strong><small>${esc(s.summary)}</small></div><em>Open →</em></button>`).join('')}</div></section>`}
function materialsHTML(){const p=currentProject;return `<section class="panel"><h2>Materials checklist</h2><p>Tap each item as you gather it. Your checks save on this device.</p>${materialList(p)}</section>`}
function imagesHTML(){const p=currentProject;return `<section class="panel"><h2>Generated visual library</h2><p>Each build stage has its own visual reference. Tap any image to jump to that step.</p><div class="image-grid">${p.steps.map((s,i)=>`<button class="image-card" data-step="${i}">${stepArt(p,s,i)}<strong>${i+1}. ${esc(s.title)}</strong><span>${esc(s.summary)}</span></button>`).join('')}</div></section>`}
function notesHTML(){const p=currentProject,key=p.id;return `<section class="panel"><h2>Project Notes</h2><p>Keep measurements, troubleshooting notes, or changes here. Notes save only in this browser.</p><textarea id="noteBox" class="notes" placeholder="Example: Mirror acrylic fits tightly. Display brightness 78%. Left cable exit works best…">${esc(notes[key]||'')}</textarea><div class="note-actions"><button class="primary-btn" id="saveNote">Save Notes</button></div></section>`}
function wireProject(){$$('[data-move]').forEach(b=>b.onclick=()=>move(Number(b.dataset.move)));$$('[data-step]').forEach(b=>b.onclick=()=>{currentStep=Number(b.dataset.step);currentTab='guide';localStorage.setItem('pi-last-v5',JSON.stringify({id:currentProject.id,step:currentStep}));renderProject()});$$('[data-material]').forEach(b=>b.onclick=()=>{const k=decodeURIComponent(b.dataset.material);inventory[k]=!inventory[k];saveInv();renderTab()});const ms=$('#markStep');if(ms)ms.onclick=()=>{const k=currentProject.id+'-'+currentStep;progress[k]=!progress[k];save();renderProject()};$$('[data-tabjump]').forEach(b=>b.onclick=()=>{currentTab=b.dataset.tabjump;$$('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===currentTab));renderTab()});$$('[data-copy]').forEach(b=>b.onclick=()=>copyCode(b));const sn=$('#saveNote');if(sn)sn.onclick=()=>{notes[currentProject.id]=$('#noteBox').value;saveNotes();toast('Notes saved')};$$('[data-thumb]').forEach(b=>b.onclick=()=>toast('Visual '+(Number(b.dataset.thumb)+1)+' corresponds to instruction '+(Number(b.dataset.thumb)+1)))}
function copyCode(btn){const el=document.getElementById(btn.dataset.copy),text=el.innerText;navigator.clipboard.writeText(text).then(()=>{btn.textContent='✓ Copied';toast('Command copied');setTimeout(()=>btn.textContent='⧉ Copy',1400)}).catch(()=>{const r=document.createRange();r.selectNodeContents(el);const s=window.getSelection();s.removeAllRanges();s.addRange(r);document.execCommand('copy');s.removeAllRanges();toast('Command copied')})}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function move(delta){const n=currentStep+delta;if(n<0||n>=currentProject.steps.length)return;currentStep=n;localStorage.setItem('pi-last-v5',JSON.stringify({id:currentProject.id,step:n}));renderProject()}
function renderSetup(){show(simpleView);simpleView.innerHTML=`<div class="breadcrumb">Home / Setup Guide</div><section class="panel setup-panel"><span class="eyebrow">Start here</span><h1>Shared Raspberry Pi setup</h1><p>Complete this once before any project. Every instruction is deliberately separated so you can verify each result before continuing.</p><div class="setup-list">${foundation.map((x,i)=>`<div class="setup-step"><b>${i+1}</b><div><strong>Setup step ${i+1}</strong><p>${esc(x)}</p></div></div>`).join('')}</div><section class="command-section"><div class="section-mini"><span>Programming</span><h3>Base setup commands</h3></div><div class="code-card"><div class="code-head"><div><strong>Update Raspberry Pi OS</strong><span>bash</span></div><button class="copy-btn" data-copy="setupcmd">⧉ Copy</button></div><pre id="setupcmd"><code>sudo apt update
sudo apt full-upgrade -y
sudo reboot</code></pre></div><div class="code-card"><div class="code-head"><div><strong>Install common project tools</strong><span>bash</span></div><button class="copy-btn" data-copy="toolcmd">⧉ Copy</button></div><pre id="toolcmd"><code>sudo apt install -y chromium git python3-pip python3-venv python3-gpiozero</code></pre></div></section></section>`;$$('[data-copy]').forEach(b=>b.onclick=()=>copyCode(b))}
function renderInventory(){show(simpleView);const mats=[...new Set(projects.flatMap(p=>p.materials))];simpleView.innerHTML=`<div class="breadcrumb">Home / My Inventory</div><section class="panel"><span class="eyebrow">Hardware</span><h1>My Inventory</h1><p>Mark what you already own. The same checks appear inside each project.</p><div class="inventory-grid">${mats.map(m=>{const keys=projects.filter(p=>p.materials.includes(m)).map(p=>p.id+'::'+m);const have=keys.some(k=>inventory[k]);return `<button class="inventory-item ${have?'have':''}" data-global="${encodeURIComponent(m)}"><span>${have?'✓':'○'}</span><div><strong>${iconForMaterial(m)} ${esc(m)}</strong><small>${keys.length} project${keys.length>1?'s':''}</small></div></button>`}).join('')}</div></section>`;$$('[data-global]').forEach(b=>b.onclick=()=>{const m=decodeURIComponent(b.dataset.global);const ps=projects.filter(p=>p.materials.includes(m));const yes=ps.some(p=>inventory[p.id+'::'+m]);ps.forEach(p=>inventory[p.id+'::'+m]=!yes);saveInv();renderInventory()})}
function renderResources(){show(simpleView);simpleView.innerHTML=`<div class="breadcrumb">Home / Resources</div><section class="panel"><h1>Resources</h1><p>Use this area for official references, troubleshooting, and command snippets. The project guides remain the main step-by-step workflow.</p><div class="resource-grid"><div><strong>GPIO safety</strong><span>Use 3.3V logic. Never assume a header pin without checking the pinout.</span></div><div><strong>DSI cables</strong><span>Power down before connecting or disconnecting ribbon cables.</span></div><div><strong>Pi 5 power</strong><span>Use the appropriate USB-C supply and watch for undervoltage warnings.</span></div><div><strong>Kiosk mode</strong><span>Test the Chromium command manually before adding it to autostart.</span></div></div></section>`}
$$('.side-link').forEach(b=>b.onclick=()=>{const v=b.dataset.view;$$('.side-link').forEach(x=>x.classList.toggle('active',x===b));if(v==='home'||v==='projects')renderHome();else if(v==='inventory')renderInventory();else if(v==='setup')renderSetup();else if(v==='resources')renderResources();else if(v==='dashboard'){const p=projects.find(x=>x.id==='dashboard');openProject(p?.id||projects[0].id,0)}});
renderHome();updateOverall();
})();
</script>
</body>
</html>
