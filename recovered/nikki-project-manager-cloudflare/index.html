<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111027">
<title>Nikki Project Manager</title>
<link rel="manifest" href="manifest.json">
<style>
:root{font-family:Inter,system-ui,sans-serif;color:#f6f3ff;background:#0c0b17;--panel:#151329;--panel2:#1d1a35;--line:#302c50;--muted:#aaa5c4;--accent:#9b8cff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top right,#211d46 0,transparent 38%),#0c0b17;min-height:100vh}button,input,textarea,select{font:inherit}.shell{max-width:1200px;margin:auto;padding:22px}.top{display:flex;gap:14px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:20px}.title h1{margin:0;font-size:clamp(28px,6vw,44px)}.title p{margin:6px 0 0;color:var(--muted)}.actions{display:flex;gap:8px;flex-wrap:wrap}button,.file-label{border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:12px;padding:10px 13px;cursor:pointer}.primary{background:var(--accent);color:#100d26;border-color:transparent;font-weight:700}.toolbar{display:grid;grid-template-columns:minmax(180px,1fr) auto;gap:10px;margin-bottom:16px}.toolbar input{width:100%;border:1px solid var(--line);background:var(--panel);color:#fff;border-radius:12px;padding:12px}.board{display:grid;grid-template-columns:repeat(3,minmax(250px,1fr));gap:14px;overflow:auto;padding-bottom:8px}.col{background:rgba(21,19,41,.92);border:1px solid var(--line);border-radius:18px;padding:14px;min-height:430px}.col h2{margin:0 0 12px;font-size:16px;display:flex;justify-content:space-between}.count{color:var(--muted);font-weight:500}.cards{display:grid;gap:10px}.card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:13px}.card h3{margin:0 0 6px;font-size:15px}.card p{margin:0 0 10px;color:var(--muted);font-size:13px;white-space:pre-wrap}.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;color:var(--muted);font-size:12px}.move{display:flex;gap:5px}.move button{padding:6px 8px;border-radius:8px;font-size:11px}.empty{color:var(--muted);font-size:13px;padding:14px;border:1px dashed var(--line);border-radius:12px}.notes{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:16px}.notes textarea{width:100%;min-height:130px;border:1px solid var(--line);background:#0f0d20;color:#fff;border-radius:12px;padding:12px;resize:vertical}.modal{position:fixed;inset:0;background:#05040ac7;display:none;place-items:center;padding:18px}.modal.open{display:grid}.dialog{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.dialog h2{margin-top:0}.fields{display:grid;gap:10px}.fields input,.fields textarea,.fields select{width:100%;border:1px solid var(--line);background:#0f0d20;color:#fff;border-radius:10px;padding:10px}.dialog-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}@media(max-width:760px){.shell{padding:16px}.board{grid-template-columns:86vw 86vw 86vw}.toolbar{grid-template-columns:1fr}.actions{width:100%}.actions>*{flex:1;text-align:center}}
</style>
</head>
<body>
<main class="shell">
<header class="top"><div class="title"><h1>Nikki Project Manager</h1><p>Projects, tasks and notes — local-first and portable.</p></div><div class="actions"><button id="exportBtn">Export backup</button><label class="file-label">Import backup<input id="importInput" type="file" accept="application/json" hidden></label><button class="primary" id="newTaskBtn">+ New task</button></div></header>
<div class="toolbar"><input id="search" type="search" placeholder="Search tasks, projects or notes"><button id="clearDone">Clear done</button></div>
<section class="board" id="board"></section>
<section class="notes"><h2>Project notes</h2><textarea id="notes" placeholder="Ideas, reminders, decisions…"></textarea></section>
</main>
<div class="modal" id="modal"><form class="dialog" id="taskForm"><h2>Task</h2><div class="fields"><input id="taskTitle" required maxlength="120" placeholder="Task title"><input id="taskProject" maxlength="80" placeholder="Project"><textarea id="taskDetail" maxlength="1000" placeholder="Details"></textarea><select id="taskStatus"><option value="todo">To do</option><option value="doing">In progress</option><option value="done">Done</option></select></div><div class="dialog-actions"><button type="button" id="cancelBtn">Cancel</button><button class="primary" type="submit">Save task</button></div></form></div>
<script src="app.js"></script>
</body></html>
