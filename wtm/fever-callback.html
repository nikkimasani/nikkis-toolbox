<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#09080d"><title>Connecting Fever to WTM</title><style>body{margin:0;background:#09080d;color:#fff;font:16px system-ui;display:grid;place-items:center;min-height:100vh}.box{max-width:520px;padding:32px;border:1px solid #33283f;border-radius:24px;background:#15111a}h1{margin-top:0;color:#d7a0ff}small{color:#a99fb0}</style></head><body><div class="box"><h1>Connecting Fever…</h1><p id="msg">Finishing authorization and loading your automatic Fever feed.</p><small>You can close this page if it does not return automatically.</small></div><script>(async()=>{const msg=document.querySelector('#msg'),q=new URLSearchParams(location.search),code=q.get('code'),state=q.get('state'),error=q.get('error'),raw=localStorage.getItem('wtm-fever-oauth');if(error){msg.textContent='Fever authorization was cancelled or failed: '+error;return}if(!code||!state||!raw){msg.textContent='WTM could not finish the Fever connection. Return to WTM and tap Connect Fever again.';return}try{const cfg=JSON.parse(raw);if(cfg.state!==state)throw Error('OAuth state did not match');const r=await fetch('https://toolbox-nine-eta.vercel.app/api/wtm-fever-token',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({client_id:cfg.client_id,client_secret:cfg.client_secret,code,code_verifier:cfg.code_verifier,redirect_uri:cfg.redirect_uri})}),d=await r.json();if(!r.ok)throw Error(d.error||'Token exchange failed');localStorage.setItem('wtm-fever-token',JSON.stringify({...d,client_id:cfg.client_id,client_secret:cfg.client_secret,obtained_at:Date.now()}));localStorage.removeItem('wtm-fever-oauth');msg.textContent='Fever connected. Returning to WTM…';setTimeout(()=>location.replace('/?fever_connected=1'),500)}catch(e){msg.textContent='WTM could not finish the Fever connection: '+e.message}})()</script></body></html>
